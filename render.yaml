services:
  - type: web
    name: xray-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 4 --timeout 300 xray_api.wsgi:app
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: cerebras
      - key: DATABASE_URL
        sync: false
      - key: XRAY_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
